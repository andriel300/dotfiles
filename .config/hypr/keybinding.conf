############################
### KEYBINDING CONFIGURATION
############################

############################
# Variables
############################

$mainMod     = SUPER                # Primary modifier key (Super / Windows key)
$terminal    = ghostty
$fileManager = thunar
$browser     = zen-browser
$notes       = obsidian
$calculator  = qalculate-gtk
$menu        = dms ipc call spotlight toggle
$ScriptsPath = ~/.config/hypr/scripts


############################
# Application Launchers
############################

# Launch terminal with sound feedback
bind = $mainMod, RETURN, exec, $ScriptsPath/play-sound.sh macos-pop & $terminal

# File manager
bind = $mainMod, E, exec, $ScriptsPath/play-sound.sh menu & $fileManager

# Application launcher (DMS spotlight)
bind = $mainMod, D, exec, $ScriptsPath/play-sound.sh macos-hero & $menu

# Browser
bind = $mainMod, B, exec, $ScriptsPath/play-sound.sh macos-glass & $browser

# Notes
bind = $mainMod, O, exec, $notes

# Calculator
bind = $mainMod, C, exec, $calculator

# Emoji picker
bind = $mainMod, comma, exec, smile

# Audio utility (custom script)
bind = $mainMod CTRL, B, exec, $ScriptsPath/wofi-beats.sh


############################
# System & DMS Controls
############################

bind = SUPER, Space, exec, dms ipc call dock toggle
bind = SUPER, V,     exec, $ScriptsPath/play-sound.sh macos-frog & dms ipc call clipboard toggle
bind = SUPER, M,     exec, dms ipc call processlist toggle
bind = SUPER, N,     exec, dms ipc call notifications toggle
bind = SUPER, period,exec, dms ipc call settings toggle
bind = SUPER, X,     exec, dms ipc call powermenu toggle
bind = SUPERALT, L,  exec, $ScriptsPath/play-sound.sh lock & dms ipc call lock lock
bind = ALT, Tab, exec, dms ipc call hypr toggleOverview


############################
# General Actions
############################

bind = $mainMod SHIFT, A, exec, $ScriptsPath/toggle-animations.sh    # Toggle UI animations
bind = $mainMod, slash,    exec, $ScriptsPath/keybindings.sh          # Show keybindings
bind = $mainMod CTRL, R,   exec, $ScriptsPath/loadconfig.sh           # Reload Hyprland config
bind = $mainMod ALT, C,    exec, $ScriptsPath/border-animated-themes.sh
bind = $mainMod CTRL, Q,   exec, waypaper                              # Wallpaper selector
bind = $mainMod CTRL, W,   exec, $ScriptsPath/workmode-toggle.sh       # Toggle work/gaming profiles
bind = $mainMod, ccedilla, exec, $ScriptsPath/toggle-lang.sh           # Toggle keyboard language


############################
# Window Management
############################

bind = $mainMod, Q, exec, $ScriptsPath/close.sh  # Close active window
bind = $mainMod, T, togglefloating               # Toggle floating mode
bind = $mainMod, F, fullscreen, 0               # Toggle fullscreen
bind = $mainMod, G, togglegroup                 # Toggle window grouping

# Mouse-driven window management
bindm = $mainMod, mouse:272, movewindow
bindm = $mainMod, mouse:273, resizewindow

# Keyboard resize (pixel-based)
bind = $mainMod SHIFT, right, resizeactive, 100 0
bind = $mainMod SHIFT, left,  resizeactive, -100 0
bind = $mainMod SHIFT, down,  resizeactive, 0 100
bind = $mainMod SHIFT, up,    resizeactive, 0 -100


############################
# Scrolling Layout (Niri-style behavior)
############################

# Navigate between columns
bind = $mainMod, H, layoutmsg, move -col
bind = $mainMod, L, layoutmsg, move +col

bind = $mainMod, left, movefocus, l
bind = $mainMod, right, movefocus, r

# Resize current column (percentage-based)
bind = $mainMod SHIFT, H, layoutmsg, colresize -0.05
bind = $mainMod SHIFT, L, layoutmsg, colresize +0.05

# Swap columns
bind = $mainMod CTRL, H, layoutmsg, swapcol l
bind = $mainMod CTRL, L, layoutmsg, swapcol r

# Promote window to its own column
bind = $mainMod SHIFT, Return, layoutmsg, promote

# Toggle focus centering behavior (center/fit)
bind = $mainMod, Tab, layoutmsg, togglefit


############################
# Screenshots
############################

bind = , PRINT,       exec, $ScriptsPath/omarchy-cmd-screenshot
bind = SHIFT, PRINT,  exec, $ScriptsPath/omarchy-cmd-screenshot window
bind = CTRL, PRINT,   exec, $ScriptsPath/omarchy-cmd-screenshot output


############################
# Workspace Management
############################

# Switch workspace (custom script with sound)
bind = $mainMod, 1, exec, ~/.config/hypr/scripts/switch_workspace.sh 1
bind = $mainMod, 2, exec, ~/.config/hypr/scripts/switch_workspace.sh 2
bind = $mainMod, 3, exec, ~/.config/hypr/scripts/switch_workspace.sh 3
bind = $mainMod, 4, exec, ~/.config/hypr/scripts/switch_workspace.sh 4
bind = $mainMod, 5, exec, ~/.config/hypr/scripts/switch_workspace.sh 5
bind = $mainMod, 6, exec, ~/.config/hypr/scripts/switch_workspace.sh 6
bind = $mainMod, 7, exec, ~/.config/hypr/scripts/switch_workspace.sh 7
bind = $mainMod, 8, exec, ~/.config/hypr/scripts/switch_workspace.sh 8
bind = $mainMod, 9, exec, ~/.config/hypr/scripts/switch_workspace.sh 9
bind = $mainMod, 0, exec, ~/.config/hypr/scripts/switch_workspace.sh 10

# Move active window to workspace
bind = $mainMod SHIFT, 1, movetoworkspace, 1
bind = $mainMod SHIFT, 2, movetoworkspace, 2
bind = $mainMod SHIFT, 3, movetoworkspace, 3
bind = $mainMod SHIFT, 4, movetoworkspace, 4
bind = $mainMod SHIFT, 5, movetoworkspace, 5
bind = $mainMod SHIFT, 6, movetoworkspace, 6
bind = $mainMod SHIFT, 7, movetoworkspace, 7
bind = $mainMod SHIFT, 8, movetoworkspace, 8
bind = $mainMod SHIFT, 9, movetoworkspace, 9
bind = $mainMod SHIFT, 0, movetoworkspace, 10

# Move all windows (custom script)
bind = $mainMod CTRL, 1, exec, $ScriptsPath/moveTo.sh 1
bind = $mainMod CTRL, 2, exec, $ScriptsPath/moveTo.sh 2
bind = $mainMod CTRL, 3, exec, $ScriptsPath/moveTo.sh 3
bind = $mainMod CTRL, 4, exec, $ScriptsPath/moveTo.sh 4
bind = $mainMod CTRL, 5, exec, $ScriptsPath/moveTo.sh 5
bind = $mainMod CTRL, 6, exec, $ScriptsPath/moveTo.sh 6
bind = $mainMod CTRL, 7, exec, $ScriptsPath/moveTo.sh 7
bind = $mainMod CTRL, 8, exec, $ScriptsPath/moveTo.sh 8
bind = $mainMod CTRL, 9, exec, $ScriptsPath/moveTo.sh 9
bind = $mainMod CTRL, 0, exec, $ScriptsPath/moveTo.sh 10

# Workspace cycling
bind = $mainMod, mouse_down, workspace, e+1
bind = $mainMod, mouse_up,   workspace, e-1
bind = $mainMod CTRL, down,  workspace, empty


############################
# Special Workspace (Scratchpad)
############################

bind = $mainMod, S, togglespecialworkspace, magic
bind = $mainMod SHIFT, S, movetoworkspace, special:magic


############################
##! Hardware & Media Keys
############################

#! Brightness
bind = , XF86MonBrightnessUp,   exec, brightnessctl -q s +10%
bind = , XF86MonBrightnessDown, exec, brightnessctl -q s 10%-

# Volume
bind = , XF86AudioRaiseVolume, exec, $ScriptsPath/play-sound.sh volume-up & pactl set-sink-volume @DEFAULT_SINK@ +5%
bind = , XF86AudioLowerVolume, exec, $ScriptsPath/play-sound.sh volume-down & pactl set-sink-volume @DEFAULT_SINK@ -5%
bind = , XF86AudioMute,        exec, $ScriptsPath/play-sound.sh volume-mute & wpctl set-mute @DEFAULT_AUDIO_SINK@ toggle
bind = , XF86AudioMicMute,     exec, pactl set-source-mute @DEFAULT_SOURCE@ toggle

# Media controls
bind = , XF86AudioPlay,  exec, playerctl play-pause
bind = , XF86AudioPause, exec, playerctl pause
bind = , XF86AudioNext,  exec, playerctl next
bind = , XF86AudioPrev,  exec, playerctl previous

# System
bind = , XF86Calculator, exec, qalculate-gtk
bind = , XF86Lock,       exec, hyprlock

# Keyboard backlight (SMC devices)
bind = , code:238, exec, brightnessctl -d smc::kbd_backlight s +10
bind = , code:237, exec, brightnessctl -d smc::kbd_backlight s 10-
