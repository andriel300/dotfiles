###################
### KEYBINDINGS ###
###################

# Set programs that you use
$terminal = ghostty
$fileManager = thunar
$menu = ~/.config/hypr/scripts/launcher.sh
$reloadBar = ~/.config/hypr/scripts/waybar-reload.sh
$browser = zen-browser
$ScriptsPath = ~/.config/hypr/scripts
$notes = obsidian


# See https://wiki.hyprland.org/Configuring/Keywords/
$mainMod = SUPER # Sets "Windows" key as main modifier

# Applications
bind = $mainMod, RETURN, exec, sh -c "$terminal & pw-play --volume 0.5 '/home/diel/Music/Saved Audio/macOS Big Sur Sounds/Pop.wav'"
bind = $mainMod, E, exec, sh -c "$fileManager & pw-play --volume 0.5 '/home/diel/Music/Saved Audio/macOS Big Sur Sounds/Ping.wav'" # Open file manager
bind = $mainMod, D, exec, sh -c "$menu & pw-play --volume 0.5 '/home/diel/Music/Saved Audio/macOS Big Sur Sounds/Hero.wav'" # Open launcher
bind = $mainMod, B, exec, sh -c "$browser & pw-play --volume 0.5 '/home/diel/Music/Saved Audio/macOS Big Sur Sounds/Glass.wav'" # Open browser
bind = $mainMod, comma, exec, smile # Open emoji picker
bind = $mainMod CTRL, C, exec, gnome-calculator # open calculator
bind = $mainMod CTRL, B, exec, sh -c "$ScriptsPath/rofi-beats.sh & pw-play --volume 0.5 '/home/diel/Music/Saved Audio/macOS Big Sur Sounds/Hero.wav'" # open rofi-beats
bind = $mainMod, O, exec, $notes # Open obsidian

# Actions
bind = $mainMod SHIFT, A, exec, $ScriptsPath/toggle-animations.sh # Toggle animations
bind = $mainMod, slash, exec, $ScriptsPath/keybindings.sh # Show keybindings
bind = $mainMod ALT, G, exec, $ScriptsPath/gamemode.sh # Toggle game mode
bind = $mainMod CTRL, R, exec, $ScriptsPath/loadconfig.sh # Reload hyprland config
bind = $mainMod, V, exec, $ScriptsPath/cliphist.sh # Open clipboard manager
bind = $mainMod, C, exec, $ScriptsPath/border-animated-themes.sh # menu animated borders
# bind = $mainMod CTRL, Q, exec, $ScriptsPath/wallpaper_selector.sh # change wallpaper
bind = $mainMod CTRL, Q, exec, $ScriptsPath/wallpaper-selector-2.sh # change wallpaper


# Window
bind = $mainMod, Q, exec, $ScriptsPath/close.sh # Close window
bind = $mainMod, T, togglefloating # Toggle active windows into floating model
bind = $mainMod SHIFT, T, exec, $ScriptsPath/toggleallfloat.sh # Toggle all windows into floating mode
bind = $mainMod, F, fullscreen, 0                                                              # Set active window to fullscreen
bind = $mainMod, G, togglegroup # Toggle window group
bind = $mainMod, K, swapsplit # Swapsplit
bind = $mainMod, M, exit, # exit hyprland
bind = $mainMod, P, pseudo, # dwindle
bind = $mainMod, J, togglesplit, # dwindle
bind = $mainMod, R, exec, $reloadBar
bind = $mainMod, L, exec, $ScriptsPath/wlogout.sh # start wlogout
bindm = $mainMod, mouse:272, movewindow # Move window with the mouse
bindm = $mainMod, mouse:273, resizewindow # Resize window with the mouse
bind = $mainMod SHIFT, right, resizeactive, 100 0 # Increase window width with keyboard
bind = $mainMod SHIFT, left, resizeactive, -100 0 # Reduce window width with keyboard
bind = $mainMod SHIFT, down, resizeactive, 0 100 # Increase window height with keyboard
bind = $mainMod SHIFT, up, resizeactive, 0 -100 # Reduce window height with keyboard

## Screenshots binds ##
bind = , PRINT, exec, hyprshot -m output # print monitor
# Screenshot region
bind = $shiftMod, PRINT, exec, hyprshot -m region # print region
# Screenshot window
bind = $mainMod, PRINT, exec, hyprshot -m window #print window

# These keys are also binded to the 'resizeactive' dispatcher
binde = $mainMod+Shift, Right, exec, pw-play --volume 0.5 '/home/diel/Music/Saved Audio/Harmony/button-pressed.ogg'
binde = $mainMod+Shift, Left, exec, pw-play --volume 0.5 '/home/diel/Music/Saved Audio/Harmony/button-pressed.ogg'
binde = $mainMod+Shift, Up, exec, pw-play --volume 0.5 '/home/diel/Music/Saved Audio/Harmony/button-pressed.ogg'
binde = $mainMod+Shift, Down, exec, pw-play --volume 0.5 '/home/diel/Music/Saved Audio/Harmony/button-pressed.ogg'

# Move focus with mainMod + arrow keys
bind = $mainMod, left, movefocus, l
bind = $mainMod, right, movefocus, r
bind = $mainMod, up, movefocus, u
bind = $mainMod, down, movefocus, d

# Workspace bindings with sound (using script)
bind = $mainMod, 1, exec, ~/.config/hypr/scripts/switch_workspace.sh 1 # Open workspace 1
bind = $mainMod, 2, exec, ~/.config/hypr/scripts/switch_workspace.sh 2 # Open workspace 2
bind = $mainMod, 3, exec, ~/.config/hypr/scripts/switch_workspace.sh 3 # Open workspace 3
bind = $mainMod, 4, exec, ~/.config/hypr/scripts/switch_workspace.sh 4 # Open workspace 4
bind = $mainMod, 5, exec, ~/.config/hypr/scripts/switch_workspace.sh 5 # Open workspace 5
bind = $mainMod, 6, exec, ~/.config/hypr/scripts/switch_workspace.sh 6 # Open workspace 6
bind = $mainMod, 7, exec, ~/.config/hypr/scripts/switch_workspace.sh 7 # Open workspace 7
bind = $mainMod, 8, exec, ~/.config/hypr/scripts/switch_workspace.sh 8 # Open workspace 8
bind = $mainMod, 9, exec, ~/.config/hypr/scripts/switch_workspace.sh 9 # Open workspace 9
bind = $mainMod, 0, exec, ~/.config/hypr/scripts/switch_workspace.sh 10 # Open workspace 10

bind = $mainMod SHIFT, 1, movetoworkspace, 1 # Move active window to workspace 1
bind = $mainMod SHIFT, 2, movetoworkspace, 2 # Move active window to workspace 2
bind = $mainMod SHIFT, 3, movetoworkspace, 3 # Move active window to workspace 3
bind = $mainMod SHIFT, 4, movetoworkspace, 4 # Move active window to workspace 4
bind = $mainMod SHIFT, 5, movetoworkspace, 5 # Move active window to workspace 5
bind = $mainMod SHIFT, 6, movetoworkspace, 6 # Move active window to workspace 6
bind = $mainMod SHIFT, 7, movetoworkspace, 7 # Move active window to workspace 7
bind = $mainMod SHIFT, 8, movetoworkspace, 8 # Move active window to workspace 8
bind = $mainMod SHIFT, 9, movetoworkspace, 9 # Move active window to workspace 9
bind = $mainMod SHIFT, 0, movetoworkspace, 10 # Move active window to workspace 10

bind = $mainMod, Tab, workspace, m+1 # Open next workspace
bind = $mainMod SHIFT, Tab, workspace, m-1 # Open previous workspace

bind = $mainMod CTRL, 1, exec, $ScriptsPath/moveTo.sh 1 # Move all windows to workspace 1
bind = $mainMod CTRL, 2, exec, $ScriptsPath/moveTo.sh 2 # Move all windows to workspace 2
bind = $mainMod CTRL, 3, exec, $ScriptsPath/moveTo.sh 3 # Move all windows to workspace 3
bind = $mainMod CTRL, 4, exec, $ScriptsPath/moveTo.sh 4 # Move all windows to workspace 4
bind = $mainMod CTRL, 5, exec, $ScriptsPath/moveTo.sh 5 # Move all windows to workspace 5
bind = $mainMod CTRL, 6, exec, $ScriptsPath/moveTo.sh 6 # Move all windows to workspace 6
bind = $mainMod CTRL, 7, exec, $ScriptsPath/moveTo.sh 7 # Move all windows to workspace 7
bind = $mainMod CTRL, 8, exec, $ScriptsPath/moveTo.sh 8 # Move all windows to workspace 8
bind = $mainMod CTRL, 9, exec, $ScriptsPath/moveTo.sh 9 # Move all windows to workspace 9
bind = $mainMod CTRL, 0, exec, $ScriptsPath/moveTo.sh 10 # Move all windows to workspace 10

# Example special workspace (scratchpad)
bind = $mainMod, S, togglespecialworkspace, magic
bind = $mainMod SHIFT, S, movetoworkspace, special:magic

bind = $mainMod, mouse_down, workspace, e+1 # Open next workspace
bind = $mainMod, mouse_up, workspace, e-1 # Open previous workspace
bind = $mainMod CTRL, down, workspace, empty # Open the next empty workspace

# Fn keys
bind = , XF86MonBrightnessUp, exec, brightnessctl -q s +10% # Increase brightness by 10%
bind = , XF86MonBrightnessDown, exec, brightnessctl -q s 10%- # Reduce brightness by 10%
bind = , XF86AudioRaiseVolume, exec, pactl set-sink-volume @DEFAULT_SINK@ +5% # Increase volume by 5%
bind = , XF86AudioLowerVolume, exec, pactl set-sink-volume @DEFAULT_SINK@ -5% # Reduce volume by 5%
bind = , XF86AudioMute, exec, wpctl set-mute @DEFAULT_AUDIO_SINK@ toggle # Toggle mute
bind = , XF86AudioPlay, exec, playerctl play-pause # Audio play pause
bind = , XF86AudioPause, exec, playerctl pause # Audio pause
bind = , XF86AudioNext, exec, playerctl next # Audio next
bind = , XF86AudioPrev, exec, playerctl previous # Audio previous
bind = , XF86AudioMicMute, exec, pactl set-source-mute @DEFAULT_SOURCE@ toggle # Toggle microphone
bind = , XF86Calculator, exec, gnome-calculator # Open calculator
bind = , XF86Lock, exec, hyprlock # Open screenlock

bind = , code:238, exec, brightnessctl -d smc::kbd_backlight s +10
bind = , code:237, exec, brightnessctl -d smc::kbd_backlight s 10- 
