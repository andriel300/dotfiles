# Rofi & Wofi
layerrule {
  name = layerrule-1
  blur = on
  match:namespace = wofi
}

layerrule {
  name = layerrule-2
  blur = on
  ignore_alpha = 0
  match:namespace = rofi
}


# notifications dunst, swww
layerrule {
  name = layerrule-3
  blur = on
  ignore_alpha = 0
  match:namespace = notifications
}

layerrule {
  name = layerrule-4
  ignore_alpha = 0.5
  blur = on
  match:namespace = notifications-window
}

layerrule {
  name = layerrule-5
  ignore_alpha = 0
  blur = on
  match:namespace = swww-daemon
}


# miscellanions
layerrule {
  name = layerrule-6
  no_anim = on
  match:namespace = hyprpicker
}

layerrule {
  name = layerrule-7
  no_anim = on
  match:namespace = selection
}

layerrule {
  name = layerrule-8
  blur = on
  match:namespace = logout_dialog
}


# hyprpanel
layerrule {
  name = layerrule-9
  blur = on
  match:namespace = bar-0
}


# Waybar
layerrule {
  name = layerrule-10
  blur = on
  blur_popups = on
  ignore_alpha = 0.2
  match:namespace = waybar
}


# SwayNC
layerrule {
  name = layerrule-11
  blur = on
  ignore_alpha = 0.5
  match:namespace = swaync-control-center
}

layerrule {
  name = layerrule-12
  blur = on
  ignore_alpha = 0.5
  match:namespace = swaync-notification-window
}

# Modals
layerrule {
    name = layerrule-13
    blur = on
    ignore_alpha = 0
    match:namespace = dms:(polkit|notification-center-modal|workspace-overview|color-picker|clipboard|spotlight|settings|process-list-modal)
}

# Shell components (bar, popouts, etc.)
layerrule {
    name = layerrule-14
    blur = on
    ignore_alpha = 0
    match:namespace = dms:(bar|tooltip|toast|dock-context-menu|system-update)
}

# Animations
layerrule {
    name = layerrule-15
    animation = slide right
    match:namespace = dms:control-center
}

layerrule {
    name = layerrule-16
    animation = slide top
    match:namespace = dms:workspace-overview
}
