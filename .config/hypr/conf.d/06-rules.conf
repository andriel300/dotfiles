##############################
### WINDOWS AND WORKSPACES ###
##############################


windowrule {
  name = windowrule-1
  suppress_event = maximize
  match:class = .*
}

windowrule {
  name = windowrule-2
  idle_inhibit = fullscreen
  match:fullscreen = 1
}


windowrule {
  name = windowrule-3
  float = on
  match:class = ^([Xx]dg-desktop-portal-gtk)$
}


# Emoji Picker Smile
windowrule {
  name = windowrule-4
  float = on
  pin = on
  move = ((monitor_w*1)-window_w-40) (90)
  match:class = (it.mijorus.smile)
}

windowrule {
  name = windowrule-5
  opacity = 0.70 0.70 1
  match:class = ^(it.mijorus.smile)$
}



# Pavucontrol floating
windowrule {
  name = windowrule-6
  float = on
  size = 700 600
  center = on
  pin = on
  match:class = (.*org.pulseaudio.pavucontrol.*)
}


# qbittorrent
windowrule {
  name = windowrule-7
  float = on
  size = 1280 720
  match:class = (org.qbittorrent.qBittorrent)
}


windowrule {
  name = windowrule-8
  float = on
  size = 900 500
  move = (center)
  match:title = ^Remove torrent\(s\)$
}


# qalculate-gtk
windowrule {
  name = windowrule-9
  float = on
  size = 700 600
  center = on
  match:class = (qalculate-gtk)
}


# Gnome apps
windowrule {
  name = windowrule-10
  float = on
  size = 720 720
  match:class = ^(org.gnome.gedit)
}


# Browser settings
windowrule {
  name = windowrule-11
  float = on
  match:title = ^(Page Info)(.*)$
  match:class = ^(zen)$
}

windowrule {
  name = windowrule-12
  float = on
  match:title = ^(About Zen Browser)(.*)$
  match:class = ^(zen)$
}


windowrule {
  name = windowrule-13
  float = on
  pin = on
  move = ((monitor_w*1)-785) ((monitor_h*1)-486)
  size = 785 486
  opacity = 1.0 1.0
  keep_aspect_ratio = on
  match:title = ^(Picture-in-Picture)$
}


windowrule {
  name = windowrule-14
  float = on
  match:class = ^(.*)$
  match:initial_title = ^(.*)(top)(.*)$
}

windowrule {
  name = windowrule-15
  float = on
  match:class = ^(.*)$
  match:initial_title = ^(.*)(btop)(.*)$
}

windowrule {
  name = windowrule-16
  float = on
  match:class = ^(.*)$
  match:initial_title = ^(.*)(htop)(.*)$
}


#zoom 
windowrule {
  name = windowrule-17
  stay_focused = on
  match:class = (zoom)
  match:initial_title = (menu window)
}


# Fix some dragging issues with XWayland
windowrule {
  name = windowrule-18
  no_focus = on
  match:class = ^$
  match:title = ^$
  match:xwayland = 1
  match:float = 1
  match:fullscreen = 0
  match:pin = 0
}


# Steam rules
windowrule {
  name = windowrule-19
  fullscreen = on
  match:class = ^steam_app\d+$
}

windowrule {
  name = windowrule-20
  monitor = 1
  workspace = 10
  match:class = ^steam_app_\d+$
}

workspace = 10, border:false, rounding:false

windowrule {
  name = windowrule-21
  float = on
  size = 800 600
  center = on
  opacity = 0.80 0.80 1
  match:class = ^(steamwebhelper)$
}

windowrule {
  name = windowrule-22
  float = on
  match:class = ^([Ss]team)$
  match:title = ^((?![Ss]team).*)$
}

windowrule {
  name = windowrule-23
  workspace = 3 silent
  tile = on
  match:class = ^([Ss]team)$
  match:title = ^([Ss]team)$
}

windowrule {
  name = windowrule-24
  float = on
  match:class = ^([Ss]team)$
  match:title = negative:^([Ss]team)$
}

windowrule {
  name = windowrule-25
  opacity = 0.80 0.80 1
  match:class = ^([Ss]team)$
}


