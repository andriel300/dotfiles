#################
### AUTOSTART ###
#################

exec-once = dbus-update-activation-environment --systemd WAYLAND_DISPLAY XDG_CURRENT_DESKTOP QT_QPA_PLATFORMTHEME
exec-once = dbus-update-activation-environment --systemd --all
exec-once = nm-applet --indicator
exec-once = udiskie --no-automount --smart-tray
exec-once = hypridle
exec-once = hyprctl setcursor Bibata-Modern-Ice 24
exec-once = hyprpm reload -n
exec-once = $ScriptsPath/hyprsocket.sh
exec-once = $ScriptsPath/cleanup.sh
exec-once = /usr/lib/polkit-gnome/polkit-gnome-authentication-agent-1
exec-once = wl-paste --type text --watch cliphist store
exec-once = wl-paste --type image --watch cliphist store

# Load Notification Daemon
# exec-once = dunst # notifications 
exec-once = swaync # modern notifications

# BAR
# exec-once = hyprpanel
exec-once = waybar

