#################
### AUTOSTART ###
#################
$ScriptsPath = ~/.config/hypr/scripts

exec-once = pw-play --volume 0.5 '/home/diel/Music/Saved Audio/desktop-login.ogg'
exec-once = dbus-update-activation-environment --systemd WAYLAND_DISPLAY XDG_CURRENT_DESKTOP QT_QPA_PLATFORMTHEME
exec-once = dbus-update-activation-environment --systemd --all
exec-once = nm-applet --indicator
exec-once = udiskie --no-automount --smart-tray
exec-once = hypridle
exec-once = hyprctl setcursor Bibata-Modern-Ice 24
# exec-once = hyprpm reload -n
exec-once = $ScriptsPath/hyprsocket.sh
exec-once = $ScriptsPath/cleanup.sh
exec-once = /usr/lib/polkit-gnome/polkit-gnome-authentication-agent-1
exec-once = wl-paste --type text --watch cliphist store
exec-once = wl-paste --type image --watch cliphist store
# Load Notification Daemon
# exec-once = dunst # notifications
exec-once = swaync # modern notifications

# Wallpaper sockett daemon
exec-once = swww-daemon
# BAR
# exec-once = hyprpanel
exec-once = waybar

# AUTOSTART MY FAVORITE APPS
# exec-once = [workspace 1 silent] zen-browser
exec-once = [workspace 2 silent] vesktop
exec-once = [workspace 3 silent] steam
# exec-once = [workspace 4 silent] firefox
