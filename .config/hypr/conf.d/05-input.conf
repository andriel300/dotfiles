#############
### INPUT ###
#############

input {
    kb_layout = br
    kb_variant =
    kb_model =
    kb_options =
    kb_rules =
    numlock_by_default = true
    repeat_delay = 250
    repeat_rate = 35
  
    follow_mouse = 1
    force_no_accel = 1
    special_fallthrough = true
    sensitivity = 0

    touchpad {
        natural_scroll = yes
        disable_while_typing = true
        clickfinger_behavior = true
        scroll_factor = 0.5
    }
}

binds {
    scroll_event_delay = 0
}

device {
  name = epic-mouse-v1
    sensitivity = -0.5
}

cursor {
    no_hardware_cursors = true
}
